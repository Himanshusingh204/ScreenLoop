<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark glassmorphic background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f13" />
      <stop offset="100%" stop-color="#1a1a24" />
    </linearGradient>
    
    <!-- Vibrant brand gradient (Purple to Pink) -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c5cfc" />
      <stop offset="100%" stop-color="#ff4d85" />
    </linearGradient>
    
    <!-- Neon glow effect -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base -->
  <rect width="512" height="512" rx="110" fill="url(#bg-grad)" />

  <!-- Outer Monitor Frame -->
  <rect x="96" y="126" width="320" height="220" rx="24" fill="none" stroke="#ffffff" stroke-width="20" stroke-opacity="0.9" />
  
  <!-- Monitor Stand -->
  <path d="M 216 346 L 296 346 M 256 346 L 256 406 M 196 406 L 316 406" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9" />

  <!-- ScreenLoop Infinity Symbol -->
  <path d="M 166 236 C 166 186, 236 186, 256 236 C 276 286, 346 286, 346 236 C 346 186, 276 186, 256 236 C 236 286, 166 286, 166 236 Z" 
        fill="none" stroke="url(#accent-grad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)" />
        
  <!-- Play Button Accent -->
  <polygon points="246,222 274,236 246,250" fill="#ffffff" />
</svg>
