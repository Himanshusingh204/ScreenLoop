# Room-affinity load balancer: every socket for the same ?room= lands on the same node,
# because rooms live in that node's memory. Redis (REDIS_URL) relays broadcasts across nodes.
# Each proxied WebSocket consumes 2 connections (client + upstream). The default of 512 caps the LB at ~256 users.
worker_rlimit_nofile 200000;
events { worker_connections 100000; }
http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream signaling {
    hash $arg_room consistent;   # shortcut: sockets without ?room= hash to one node; fine for /api/token (stateless)
    server server1:4000;
    server server2:4000;
    server server3:4000;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://signaling;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # Overwrite (never append to) the client-supplied header so the rightmost hop is always the real peer
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 3600s;
    }
  }
}
