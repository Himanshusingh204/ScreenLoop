# Room-affinity load balancer: every socket for the same ?room= lands on the same node,
# because rooms live in that node's memory. Redis (REDIS_URL) relays broadcasts across nodes.
events {}
http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream signaling {
    hash $arg_room consistent;   # shortcut: sockets without ?room= hash to one node; fine for /api/token (stateless)
    server server1:4000;
    server server2:4000;
    server server3:4000;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://signaling;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
    }
  }
}
