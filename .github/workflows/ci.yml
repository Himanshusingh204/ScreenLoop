name: CI Build & Security Checks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  client-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: client/package-lock.json

    - name: Install client dependencies
      run: cd client && npm ci

    - name: Run client tests
      run: cd client && npm test

    - name: Build client production bundle
      run: cd client && npm run build

    - name: Verify build output exists
      run: test -d client/dist && echo "Build output OK"

  server-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: server/package-lock.json

    - name: Install server dependencies
      run: cd server && npm ci

    - name: Run server tests
      run: cd server && npm test

    - name: Syntax check server files
      run: |
        cd server
        node --check src/index.js
        node --check src/socketHandlers.js
        node --check src/roomManager.js
        node --check src/rateLimiter.js

    - name: Smoke test - start server and check health
      run: |
        cd server
        node src/index.js &
        SERVER_PID=$!
        sleep 3
        curl -f http://localhost:4000/health || (kill $SERVER_PID && exit 1)
        kill $SERVER_PID
        echo "Server smoke test passed"
