name: Bug Report
description: Report an issue or unexpected behavior in ScreenLoop
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help us reproduce and fix it.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: When attempting to join a room with PIN protection enabled, ...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can maintainers reproduce this behavior?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
      placeholder: Expected to connect seamlessly without signaling timeout.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Screen Recordings
      description: Drag and drop screenshots or videos showing the issue.
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: Which browser are you experiencing this issue on?
      options:
        - Google Chrome
        - Mozilla Firefox
        - Microsoft Edge
        - Apple Safari
        - Brave
        - Other (specify in context)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
        - iOS / iPadOS
        - Android
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console Logs
      description: Relevant errors or output from browser developer tools or server terminal.
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I am running a supported browser and version.
          required: true
