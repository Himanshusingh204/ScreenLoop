name: Feature Request
description: Propose a new feature, enhancement, or UI improvement for ScreenLoop
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an idea to make ScreenLoop better!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of the pain point or problem.
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or feature you'd like to see implemented.
      placeholder: It would be great to have...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
  - type: dropdown
    id: component
    attributes:
      label: Component Area
      options:
        - Client (UI / Video Player / Chat)
        - WebRTC / Media Streaming
        - Signaling Server (Socket.IO)
        - Performance / Optimization
        - Accessibility / Internationalization
        - Documentation / DevOps
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, wireframes, mockups, or diagrams about the feature request here.
